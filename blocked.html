<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Mode Active</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-family: 'Inter', -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-family);
      background-color: #121212;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    h1 {
      font-size: 5rem;
      font-weight: 700;
      margin-bottom: 2rem;
      letter-spacing: -2px;
      color: #ef4444; /* red */
    }
    .focus-section {
      background: rgba(255, 255, 255, 0.05);
      padding: 2rem 4rem;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 3rem;
    }
    h3 {
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.7;
      margin-bottom: 1rem;
    }
    #blocked-focus-text {
      font-size: 2.5rem;
      font-weight: 500;
    }
    .btn-group {
      display: flex;
      gap: 1rem;
    }
    button {
      padding: 12px 24px;
      border-radius: 8px;
      font-family: var(--font-family);
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: transform 0.2s, opacity 0.2s;
    }
    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(0); }
    
    #btn-back {
      background: white;
      color: #121212;
    }
    #btn-disable {
      background: transparent;
      color: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    #btn-disable:hover {
      color: white;
      border-color: white;
    }
  </style>
</head>
<body>
  <h1>Stay Focused</h1>
  
  <div class="focus-section">
    <h3>Today's Focus</h3>
    <div id="blocked-focus-text">No focus set for today.</div>
  </div>
  
  <div class="btn-group">
    <button id="btn-back">Go Back</button>
    <button id="btn-disable">Disable Focus Mode</button>
  </div>
  
  <script src="blocked.js"></script>
</body>
</html>
